<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APEX FORMULA 2026 — driver nametag harness</title>
<script type="importmap">
{ "imports": { "three": "../lib/three.module.js" } }
</script>
<style>
  html, body { margin: 0; background: #0b0d12; color: #dfe4ec; font: 12px/1.45 ui-monospace, monospace; }
  #log { position: fixed; right: 0; top: 0; width: 40vw; height: 100vh; overflow: auto;
         padding: 10px 14px; background: rgba(8,10,14,0.94); white-space: pre-wrap; }
  .p { color: #57d98a; } .f { color: #ff6b6b; } .h { color: #8fb7ff; font-weight: bold; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="log"></div>
<script type="module">
// =============================================================================
// Driver nametag acceptance harness.
//
// Reuses the game's own label code — buildNameTag (js/car.js) and
// layoutNametags (js/nametags.js) — on a synthetic 22-car grid-start pack
// (player dead last, chase camera at main.js camMode-0 geometry), then
// asserts the round-4 judge findings are fixed, both geometrically (from the
// layout diagnostics) and at the pixel level (WebGL readback of the actual
// rendered frame):
//   1. every panel width <= 1.6x its measured glyph width,
//   2. <= 8 labels visible, nearest first, zero label-label rect overlaps,
//   3. zero labels crossing the viewport edge (incl. a forced corner case),
//   4. every labelled car >= 50% of its projected rect unoccluded by labels.
//
// Run:  python3 tools/devserver.py 8412 .  then open /tools/nametag-harness.html
// Results land in window.__HARNESS__ and are printed to the console.
// =============================================================================
import * as THREE from 'three';
import { buildNameTag } from '../js/car.js';
import { layoutNametags, TAG_MAX_VISIBLE, TAG_RANGE, TAG_ANCHOR_Y, MAX_CAR_COVER } from '../js/nametags.js';
import { DRIVERS, TEAMS } from '../js/data.js';

const W = 1280, H = 800;
const logEl = document.getElementById('log');
const results = { checks: [], pass: 0, fail: 0, stats: {}, done: false, error: null };
window.__HARNESS__ = results;

const out = (cls, s) => {
  const d = document.createElement('div');
  d.className = cls; d.textContent = s;
  logEl.appendChild(d);
  console.log(`[harness] ${s}`);
};
const check = (ok, label, detail = '') => {
  results.checks.push({ label, ok, detail });
  if (ok) { results.pass++; out('p', `PASS ${label}${detail ? ' — ' + detail : ''}`); }
  else { results.fail++; out('f', `FAIL ${label}${detail ? ' — ' + detail : ''}`); }
};

try {
  const teamById = Object.fromEntries(TEAMS.map((t) => [t.id, t]));
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  const BG = [0, 204, 0]; // improbable green: any non-BG pixel is label ink
  renderer.setClearColor(new THREE.Color(BG[0] / 255, BG[1] / 255, BG[2] / 255), 1);
  document.getElementById('app').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(72, W / H, 0.3, 6500);

  // ---------------- panel geometry: width hugs the measured glyphs ----------
  out('h', '— panel width vs glyph width (all 22 codes, real measureText) —');
  const tags = [];
  let worstRatio = 0, worstCode = '';
  for (const d of DRIVERS) {
    const tag = buildNameTag(d, teamById[d.team]);
    const ud = tag.userData.nametag;
    tags.push(tag);
    const ratio = ud.panelW / ud.textW;
    if (ratio > worstRatio) { worstRatio = ratio; worstCode = ud.code; }
    if (!(ud.textW > 10)) check(false, `real glyph measure for ${ud.code}`, `textW=${ud.textW}`);
  }
  results.stats.worstPanelRatio = worstRatio;
  check(DRIVERS.length === 22 && tags.length === 22, '22 drivers, 22 tags built');
  check(worstRatio <= 1.6, 'every panel width <= 1.6x its text width',
    `worst ${worstRatio.toFixed(3)}x (${worstCode})`);

  // ---------------- synthetic grid-start pack ------------------------------
  // two staggered columns, 4.6 m between rows — tighter than a real grid.
  // player (index 21) dead last at the origin, all 21 opponents ahead (-z).
  const cars = [];
  for (let i = 0; i < 22; i++) {
    const x = (i % 2 === 0) ? -1.9 : 1.9;
    const z = -(21 - i) * 4.6;
    const isPlayer = i === 21;
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 0.96, 5.6),
      new THREE.MeshBasicMaterial({ color: teamById[DRIVERS[i].team].color }));
    body.position.y = 0.48;
    body.visible = false; // probe passes render label ink only
    group.add(body);
    let tag = null;
    if (!isPlayer) {
      tag = tags[i];
      tag.position.y = TAG_ANCHOR_Y;
      tag.visible = false;
      group.add(tag);
    }
    scene.add(group);
    cars.push({ i, group, body, tag, isPlayer, code: DRIVERS[i].code });
  }
  const player = cars[21];

  // chase camera, main.js camMode 0 at v=0: 7.6 m back, 2.55 m up
  camera.position.set(player.group.position.x, 2.55, player.group.position.z + 7.6);
  camera.lookAt(player.group.position.x, 0.85, player.group.position.z - 10);
  camera.updateMatrixWorld();

  const candsOf = () => cars.filter((c) => !c.isPlayer).map((c) => {
    const dx = c.group.position.x - player.group.position.x;
    const dz = c.group.position.z - player.group.position.z;
    return { tag: c.tag, x: c.group.position.x, y: c.group.position.y, z: c.group.position.z, d2: dx * dx + dz * dz, car: c };
  });

  // ---------------- pixel probe helpers ------------------------------------
  const gl = renderer.getContext();
  const px = new Uint8Array(W * H * 4);
  const grab = () => {
    renderer.render(scene, camera);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  };
  const inkAt = (x, y) => { // screen coords, y down; ink = differs from BG
    const xi = Math.round(x), yi = H - 1 - Math.round(y);
    if (xi < 0 || xi >= W || yi < 0 || yi >= H) return false;
    const o = (yi * W + xi) * 4;
    return Math.abs(px[o] - BG[0]) + Math.abs(px[o + 1] - BG[1]) + Math.abs(px[o + 2] - BG[2]) > 50;
  };
  const textLineProbe = (p) => { // ink count along the glyph midline of a placed rect
    const ud = p.tag.userData.nametag;
    const w = p.rect.right - p.rect.left, h = p.rect.bottom - p.rect.top;
    const y = p.rect.top + h * ((ud.canvasH / 2) / ud.canvasH) * 1.0 + 0; // vertical centre
    const x0 = p.rect.left + w * ((ud.canvasW - ud.panelW) / 2 / ud.canvasW);
    let n = 0;
    for (let t = 0; t <= 24; t++) if (inkAt(x0 + (t / 24) * w * (ud.panelW / ud.canvasW), y)) n++;
    return n;
  };
  const containScan = (placed, label) => { // all ink must lie inside placed rects
    let stray = 0, strayAt = '';
    const infl = 2.5;
    for (let y = 0; y < H; y += 2) {
      for (let x = 0; x < W; x += 2) {
        if (!inkAt(x, y)) continue;
        let inside = false;
        for (const p of placed) {
          if (x >= p.rect.left - infl && x <= p.rect.right + infl &&
              y >= p.rect.top - infl && y <= p.rect.bottom + infl) { inside = true; break; }
        }
        if (!inside) { stray++; if (!strayAt) strayAt = `first at (${x},${y})`; }
      }
    }
    check(stray === 0, `${label}: rendered ink only inside placed label rects`,
      stray ? `${stray} stray px, ${strayAt}` : `0 stray px`);
  };

  // ================= scenario A: worst-case grid pack =======================
  out('h', '— scenario A: 22-car grid pack, player last, chase cam —');
  const diagA = layoutNametags(candsOf(), camera, W, H);
  const placedA = diagA.placed;
  const visA = cars.filter((c) => c.tag && c.tag.visible);
  results.stats.visibleA = visA.length;
  check(visA.length === placedA.length, 'diagnostics agree with sprite visibility',
    `${placedA.length} placed, ${visA.length} visible`);
  check(visA.length >= 4, 'a real pack shows several labels', `visible=${visA.length}`);
  check(visA.length <= TAG_MAX_VISIBLE, `cap: at most ${TAG_MAX_VISIBLE} labels`, `visible=${visA.length}`);

  // nearest-first: every visible car is nearer than every hidden candidate
  // that was dropped purely by the cap (no geometric reason) — approximate by
  // checking the farthest visible car against in-range hidden cars closer than it
  const inRange = candsOf().filter((c) => c.d2 < TAG_RANGE * TAG_RANGE);
  check(inRange.length > TAG_MAX_VISIBLE, 'worst case really exceeds the cap',
    `${inRange.length} cars in ${TAG_RANGE}m range`);
  const far = cars.find((c) => c.i === 0); // pole sits 96.6 m away
  check(far.tag && !far.tag.visible, `distance cull intact: pole car (96.6m) unlabelled`);

  let ovA = 0, offA = 0;
  for (let i = 0; i < placedA.length; i++) {
    const r = placedA[i].rect;
    if (r.left < -0.01 || r.top < -0.01 || r.right > W + 0.01 || r.bottom > H + 0.01) offA++;
    for (let j = i + 1; j < placedA.length; j++) {
      const q = placedA[j].rect;
      if (r.left < q.right && q.left < r.right && r.top < q.bottom && q.top < r.bottom) ovA++;
    }
  }
  check(ovA === 0, 'zero label-label rect overlaps', `pairs=${ovA}`);
  check(offA === 0, 'zero labels crossing the viewport edge', `offenders=${offA}`);

  let worstCover = 0, coverOffenders = 0;
  for (const p of placedA) {
    let cover = 0;
    for (const q of placedA) {
      const w = Math.min(q.rect.right, p.carRect.right) - Math.max(q.rect.left, p.carRect.left);
      const h = Math.min(q.rect.bottom, p.carRect.bottom) - Math.max(q.rect.top, p.carRect.top);
      if (w > 0 && h > 0) cover += w * h;
    }
    const frac = cover / ((p.carRect.right - p.carRect.left) * (p.carRect.bottom - p.carRect.top));
    worstCover = Math.max(worstCover, frac);
    if (frac > MAX_CAR_COVER + 1e-9) coverOffenders++;
  }
  results.stats.worstCoverA = worstCover;
  check(coverOffenders === 0,
    `every labelled car >= ${(1 - MAX_CAR_COVER) * 100}% of its rect unoccluded by labels`,
    `worst cover ${(worstCover * 100).toFixed(1)}%`);

  // pixel truth: the frame contains ink exactly where the layout says
  grab();
  let weakest = 99, weakestCode = '';
  for (const p of placedA) {
    const n = textLineProbe(p);
    if (n < weakest) { weakest = n; weakestCode = p.tag.userData.nametag.code; }
  }
  results.stats.weakestTextProbeA = weakest;
  check(weakest >= 3, 'every visible label draws real glyph ink at its rect',
    `weakest midline ${weakest}/25 ink px (${weakestCode})`);
  containScan(placedA, 'scenario A');

  // ================= scenario B: forced corner clamp ========================
  // move the nearest labelled car so its unclamped label would cross the
  // top-right corner, then prove the clamp both geometrically and in pixels
  out('h', '— scenario B: label forced across the top-right corner —');
  const subject = placedA[0].cand.car;
  const d = 9; // metres ahead of the camera
  const P00 = camera.projectionMatrix.elements[0], P11 = camera.projectionMatrix.elements[5];
  // pick NDC so the unclamped rect must cross both right and top edges
  const vx = 0.985 * d / P00, vy = 0.97 * d / P11;
  const wp = new THREE.Vector3(vx, vy, -d).applyMatrix4(camera.matrixWorld);
  subject.group.position.set(wp.x, wp.y - TAG_ANCHOR_Y, wp.z);
  const diagB = layoutNametags(candsOf(), camera, W, H);
  const pb = diagB.placed.find((p) => p.tag === subject.tag);
  check(!!pb, 'corner car still labelled (nearest to camera)');
  if (pb) {
    const rawRight = W * (0.985 + 1) / 2 + (pb.rect.right - pb.rect.left) / 2;
    check(rawRight > W, 'unclamped rect would cross the right edge', `raw right ${rawRight.toFixed(0)}px > ${W}`);
    check(pb.rect.right <= W + 0.01 && pb.rect.left >= -0.01 &&
          pb.rect.top >= -0.01 && pb.rect.bottom <= H + 0.01,
      'clamped rect fully inside the viewport',
      `[${pb.rect.left.toFixed(0)},${pb.rect.top.toFixed(0)}]–[${pb.rect.right.toFixed(0)},${pb.rect.bottom.toFixed(0)}]`);
    check(Math.abs(pb.tag.center.x - 0.5) > 0.01 || Math.abs(pb.tag.center.y) > 0.01,
      'sprite.center carries a real clamp offset',
      `center=(${pb.tag.center.x.toFixed(3)}, ${pb.tag.center.y.toFixed(3)})`);
    grab();
    const n = textLineProbe(pb);
    check(n >= 3, 'clamped label renders its glyphs at the clamped rect', `midline ${n}/25 ink px`);
    containScan(diagB.placed, 'scenario B');
  }

  // ---------------- composite for eyeballing (cars + labels) ---------------
  for (const c of cars) c.body.visible = true;
  renderer.render(scene, camera);
  results.done = true;
  out('h', `DONE: ${results.pass} pass, ${results.fail} fail`);
  console.log(`[harness] DONE pass=${results.pass} fail=${results.fail}`);
} catch (err) {
  results.error = String(err && err.stack || err);
  results.done = true;
  out('f', 'ERROR ' + results.error);
  console.log('[harness] ERROR ' + results.error);
}
</script>
</body>
</html>
