name: Bug report
description: Report a reproducible problem in the simulator
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Do not include secrets or private security findings.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Quick Race
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch, or release tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, browser version, operating system, and input device.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or media
      description: Paste relevant console output or attach screenshots or a short recording.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a private security report.
          required: true
